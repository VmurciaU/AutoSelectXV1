<!-- ================================================================
     MODAL EDITAR BOMBA DETECTADA (SOLO BD)
     Se usa desde panel_pumps_detected_DB.html
================================================================ -->
<div id="modal_edit_detected"
  class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">

  <div class="bg-gray-800 text-gray-200 rounded-lg shadow-xl w-full max-w-2xl p-5 border border-gray-700">

    <!-- Header -->
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-base font-semibold">Editar bomba detectada (BD)</h2>
      <button type="button"
        onclick="closeModal('modal_edit_detected')"
        class="text-gray-400 hover:text-white text-xl leading-none">
        &times;
      </button>
    </div>

    <!-- FORM: la acción se setea desde JS con el pump_id -->
    <form id="form_edit_detected" method="post" class="space-y-3 text-xs">
      <!-- índice en array JS (db) solo para referencia -->
      <input type="hidden" id="edit_detected_index">

      <!-- ===================== CAMPOS RAÍZ ===================== -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block mb-1 text-[11px] text-gray-400">Fluido</label>
          <input id="edit_fluid" name="fluid" type="text"
            class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
        </div>

        <div>
          <label class="block mb-1 text-[11px] text-gray-400">Viscosidad (cP)</label>
          <input id="edit_viscosity" name="viscosity" type="number" step="0.01"
            class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block mb-1 text-[11px] text-gray-400">Presión descarga (original)</label>
          <input id="edit_discharge_pressure" name="discharge_pressure" type="number" step="0.01"
            class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
        </div>
        <div>
          <label class="block mb-1 text-[11px] text-gray-400">Presión descarga (PSI std)</label>
          <input id="edit_discharge_pressure_std" name="discharge_pressure_std" type="number" step="0.01"
            class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
        </div>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block mb-1 text-[11px] text-gray-400">Caudal mín. (GPD)</label>
          <input id="edit_flow_min" name="flow_min" type="number" step="0.001"
            class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
        </div>
        <div>
          <label class="block mb-1 text-[11px] text-gray-400">Caudal nominal (GPD)</label>
          <input id="edit_flow_nominal" name="flow_nominal" type="number" step="0.001"
            class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
        </div>
        <div>
          <label class="block mb-1 text-[11px] text-gray-400">Caudal máx. (GPD)</label>
          <input id="edit_flow_max" name="flow_max" type="number" step="0.001"
            class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block mb-1 text-[11px] text-gray-400">Caudal máx. std</label>
          <input id="edit_flow_max_std" name="flow_max_std" type="number" step="0.001"
            class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
        </div>
        <div>
          <label class="block mb-1 text-[11px] text-gray-400">Unidad caudal std</label>
          <input id="edit_flow_unit_std" name="flow_unit_std" type="text"
            class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block mb-1 text-[11px] text-gray-400">Cantidad de bombas</label>
          <input id="edit_cantidad" name="cantidad_bombas" type="number" min="1"
            class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
        </div>
        <div>
          <label class="block mb-1 text-[11px] text-gray-400">Estado</label>
          <select id="edit_estado" name="estado"
            class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
            <option value="borrador">borrador</option>
            <option value="ajustada">ajustada</option>
            <option value="validada">validada</option>
          </select>
        </div>
      </div>

      <!-- ===================== OPTIONAL ===================== -->
      <div class="border-t border-gray-700 pt-3 mt-2">
        <p class="text-[11px] text-gray-400 mb-2">Información adicional</p>

        <div class="grid grid-cols-2 gap-3 mb-2">
          <div>
            <label class="block mb-1 text-[11px] text-gray-400">TAG</label>
            <input id="edit_optional_tag" name="tag" type="text"
              class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
          </div>
          <div>
            <label class="block mb-1 text-[11px] text-gray-400">Servicio</label>
            <input id="edit_optional_service" name="service" type="text"
              class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-2">
          <div>
            <label class="block mb-1 text-[11px] text-gray-400">Temperatura (°C)</label>
            <input id="edit_optional_temperature" name="temperature" type="number" step="0.1"
              class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
          </div>
          <div>
            <label class="block mb-1 text-[11px] text-gray-400">Materiales</label>
            <input id="edit_optional_materials" name="materials" type="text"
              class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-2">
          <div>
            <label class="block mb-1 text-[11px] text-gray-400">Área</label>
            <input id="edit_optional_area" name="area" type="text"
              class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
          </div>
          <div>
            <label class="block mb-1 text-[11px] text-gray-400">Ubicación</label>
            <input id="edit_optional_location" name="location" type="text"
              class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600">
          </div>
        </div>

        <div>
          <label class="block mb-1 text-[11px] text-gray-400">Descripción</label>
          <textarea id="edit_optional_description" name="description" rows="2"
            class="w-full px-2 py-1 rounded bg-gray-700 border border-gray-600 resize-y"></textarea>
        </div>
      </div>

      <!-- Botonera -->
      <div class="pt-3 flex justify-end gap-2">
        <button type="button"
          onclick="closeModal('modal_edit_detected')"
          class="px-3 py-1.5 text-xs rounded bg-gray-700 hover:bg-gray-600 border border-gray-600">
          Cancelar
        </button>

        <button type="submit"
          class="px-3 py-1.5 text-xs rounded bg-emerald-700 hover:bg-emerald-600 border border-emerald-500">
          Guardar cambios
        </button>
      </div>

    </form>

  </div>
</div>
