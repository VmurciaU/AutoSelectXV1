<!-- MODAL SELECCIÓN / EDICIÓN MROY -->
<div id="modal-mroy-selector"
  class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">

  <div class="bg-gray-800 text-gray-200 rounded-lg shadow-xl w-full max-w-3xl p-5 border border-gray-700">

    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-2 border-b border-slate-700">
      <div class="flex flex-col">
        <h2 class="text-sm font-semibold text-white">
          Selección de bomba MROY – <span id="mroy-modal-tag" class="text-emerald-300"></span>
        </h2>
        <div class="text-[11px] text-gray-300 mt-0.5">
          Tag:
          <span id="mroy_header_tag" class="font-semibold text-emerald-300"></span>
          · Código MROY:
          <span id="mroy_full_code_preview" class="font-mono text-emerald-300">
            MRA1-
          </span>
        </div>
      </div>

      <button type="button" class="text-gray-400 hover:text-gray-200 text-lg"
        onclick="closeModal('modal-mroy-selector')">
        ×
      </button>
    </div>

    <!-- Body -->
    <form id="mroy-selection-form" method="post" action="" class="space-y-3 text-xs max-h-[65vh] overflow-y-auto">

      <input type="hidden" name="pump_id" id="mroy_pump_id">
      <input type="hidden" name="mroy_full_code" id="mroy_full_code">

      <div class="grid grid-cols-2 gap-4 px-4 py-3 text-xs">

        <!-- Columna izquierda: datos de proceso + 01–09 -->
        <div class="space-y-2 border-r border-slate-800 pr-4">
          <p class="text-[11px] text-gray-400 mb-1">Datos de proceso</p>

          <div class="text-gray-300">
            <span class="text-gray-400">Tag: </span>
            <span id="mroy_proc_tag" class="font-semibold text-emerald-300"></span>
          </div>

          <div class="text-gray-300">
            <span class="text-gray-400">Caudal requerido: </span>
            <span id="mroy_proc_flow" class="font-semibold"></span>
          </div>

          <div class="text-gray-300">
            <span class="text-gray-400">Presión requerida: </span>
            <span id="mroy_proc_pressure" class="font-semibold"></span>
          </div>

          <div class="text-gray-300">
            <span class="text-gray-400">Fluido: </span>
            <span id="mroy_proc_fluid" class="font-semibold"></span>
          </div>

          <!-- Configuración MROY (01–09) -->
          <div class="mt-2 space-y-2">
            <p class="text-[11px] text-gray-400 mb-1">
              Configuración MROY (MRA1)
            </p>

            <!-- 01 – Liquid End -->
            <div>
              <label class="mroy-field-label">01 – Liquid End Material</label>
              <select name="code_01" id="code_01" class="mroy-select">
                <!-- placeholder sin selección -->
                <option value="" selected disabled>Selecciona el liquid end...</option>

                {% for opt in liquid_end_options %}
                <option value="{{ opt.code }}">
                  {{ opt.code }} – {{ opt.end_material }}
                </option>
                {% endfor %}
              </select>
            </div>

            <!-- 02 – Plunger -->
            <div>
              <label class="mroy-field-label">02 – Plunger</label>
              <select name="code_02" id="code_02" class="mroy-select">
                <option value="" selected disabled>Selecciona el plunger...</option>

                {% for opt in plunger_options %}
                <option value="{{ opt.code }}">
                  {{ opt.code }} – {{ opt.plunger_in }} ({{ opt.material_pump }})
                </option>
                {% endfor %}
              </select>
            </div>

            <!-- 03 – Gear Ratio -->
            <div>
              <label class="mroy-field-label">03 – Gear Ratio</label>
              <select name="code_03" id="code_03" class="mroy-select">
                <option value="" selected disabled>Selecciona el gear ratio...</option>

                {% for opt in gear_options %}
                <option value="{{ opt.code }}">
                  {{ opt.code }} – {{ opt.description }}
                </option>
                {% endfor %}
              </select>
            </div>

            <!-- Opciones principales (04–09) -->
            <div class="mt-2 pt-2 border-t border-slate-700 space-y-2">
              <p class="text-[11px] text-gray-400 mb-1">Opciones principales (04–08)</p>

              <!-- 04 – Motor Options -->
              <div>
                <label class="mroy-field-label">04 – Motor Options</label>
                <select name="code_04" id="code_04" class="mroy-select">
                  {% for opt in motor_options %}
                  <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                    {{ opt.code }} – {{ opt.category }}{% if opt.hp_kw is not none %} ({{ opt.hp_kw }}){% endif %}
                  </option>
                  {% endfor %}
                </select>
              </div>

              <!-- 05 – Motor Mount -->
              <div>
                <label class="mroy-field-label">05 – Motor Mount</label>
                <select name="code_05" id="code_05" class="mroy-select">
                  {% for opt in motor_mount_options %}
                  <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                    {{ opt.code }} – {{ opt.description }}
                  </option>
                  {% endfor %}
                </select>
              </div>

              <!-- 06 – Pipe Connections -->
              <div>
                <label class="mroy-field-label">06 – Pipe Connections</label>
                <select name="code_06" id="code_06" class="mroy-select">
                  {% for opt in pipe_connection_options %}
                  <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                    {{ opt.code }} – {{ opt.description_metallic or opt.description_plastic }}
                  </option>
                  {% endfor %}
                </select>
              </div>

              <!-- 07 – O-Ring -->
              <div>
                <label class="mroy-field-label">07 – O-Ring</label>
                <select name="code_07" id="code_07" class="mroy-select">
                  {% for opt in oring_options %}
                  <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                    {{ opt.code }} – {{ opt.material }} ({{ opt.material_pump }})
                  </option>
                  {% endfor %}
                </select>
              </div>

              <!-- 08 – Capacity Control -->
              <div>
                <label class="mroy-field-label">08 – Capacity Control</label>
                <select name="code_08" id="code_08" class="mroy-select">
                  {% for opt in capacity_control_options %}
                  <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                    {{ opt.code }} – {{ opt.description }}
                  </option>
                  {% endfor %}
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Columna derecha: opciones extendidas 10–18 -->
        <div class="space-y-2">

          <!-- 09 – Diaphragm Rupture Detection -->
          <div>
            <label class="mroy-field-label">09 – Diaphragm Rupture Detection</label>
            <select name="code_09" id="code_09" class="mroy-select">
              {% for opt in rupture_options %}
              <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                {{ opt.code }} – {{ opt.description }}
              </option>
              {% endfor %}
            </select>
          </div>

          <p class="text-[11px] text-gray-400 mb-1">
            Configuración MROY (10–18 – Opciones extendidas)
          </p>

          <!-- 10 – Base Options -->
          <div>
            <label class="mroy-field-label">10 – Base Options</label>
            <select name="code_10" id="code_10" class="mroy-select">
              {% for opt in base_options %}
              <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                {{ opt.code }} – {{ opt.description }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- 11 – Code Complete Identifier -->
          <div>
            <label class="mroy-field-label">11 – Code Complete Identifier</label>
            <select name="code_11" id="code_11" class="mroy-select">
              {% for opt in code_identifier_options %}
              <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                {{ opt.code }} – {{ opt.description }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- 12 – Liquid End Extended -->
          <div>
            <label class="mroy-field-label">12 – Liquid End Extended</label>
            <select name="code_12" id="code_12" class="mroy-select">
              {% for opt in liquid_end_ext_options %}
              <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                {{ opt.code }} – {{ opt.description }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- 13 – Temperature Extended -->
          <div>
            <label class="mroy-field-label">13 – Temperature Extended</label>
            <select name="code_13" id="code_13" class="mroy-select">
              {% for opt in temperature_ext_options %}
              <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                {{ opt.code }} – {{ opt.description }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- 14 – Drive Extended -->
          <div>
            <label class="mroy-field-label">14 – Drive Extended</label>
            <select name="code_14" id="code_14" class="mroy-select">
              {% for opt in drive_ext_options %}
              <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                {{ opt.code }} – {{ opt.description }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- 15 – Motor Extended -->
          <div>
            <label class="mroy-field-label">15 – Motor Extended</label>
            <select name="code_15" id="code_15" class="mroy-select">
              {% for opt in motor_ext_options %}
              <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                {{ opt.code }} – {{ opt.description }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- 16 – Lubrication Options -->
          <div>
            <label class="mroy-field-label">16 – Lubrication Options</label>
            <select name="code_16" id="code_16" class="mroy-select">
              {% for opt in lubrication_options %}
              <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                {{ opt.code }} – {{ opt.description }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- 17 – Coating System -->
          <div>
            <label class="mroy-field-label">17 – Coating System</label>
            <select name="code_17" id="code_17" class="mroy-select">
              {% for opt in coating_options %}
              <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                {{ opt.code }} – {{ opt.description }}
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- 18 – Run Test Options -->
          <div>
            <label class="mroy-field-label">18 – Run Test Options</label>
            <select name="code_18" id="code_18" class="mroy-select">
              {% for opt in run_test_options %}
              <option value="{{ opt.code }}" {% if loop.first %}selected{% endif %}>
                {{ opt.code }} – {{ opt.description }}
              </option>
              {% endfor %}
            </select>
          </div>
        </div>

      </div>

      <!-- Footer -->
      <div class="flex justify-end gap-2 px-4 py-2 border-t border-slate-700">
        <button type="button" class="px-3 py-1 rounded bg-slate-700 hover:bg-slate-600 text-xs"
          onclick="closeModal('modal-mroy-selector')">
          Cancelar
        </button>
        <button type="submit" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-xs text-white">
          Guardar selección
        </button>
      </div>

    </form>
  </div>
</div>

<!-- ESTILOS ESPECÍFICOS PARA EL MODAL MROY -->
<style>
  /* Etiquetas de los campos */
  .mroy-field-label {
    font-size: 11px;
    font-weight: 600;
    color: #e0f2fe;
    /* azul muy claro tipo sky-100 */
    margin-bottom: 0.15rem;
    display: block;
  }

  /* Selects e inputs del modal */
  .mroy-select,
  .mroy-input {
    width: 100%;
    font-size: 11px;
    border-radius: 0.45rem;
    padding: 0.35rem 0.55rem;
    background: #020617;
    /* fondo azul muy oscuro (slate-950) */
    border: 1px solid rgba(34, 197, 94, 0.55);
    /* borde verde-azulado */
    color: #e0f2fe;
    /* texto azul claro */
    appearance: none;
  }

  .mroy-select::placeholder,
  .mroy-input::placeholder {
    color: #64748b;
    /* gris azulado suave */
  }

  .mroy-select:focus,
  .mroy-input:focus {
    outline: none;
    border-color: #22c55e;
    /* verde-azulado más brillante */
    box-shadow: 0 0 0 1px #22c55e;
    /* anillo tipo focus */
  }

  /* Opciones del desplegable */
  .mroy-select option {
    background-color: #020617;
    /* mismo fondo oscuro */
    color: #e0f2fe;
    /* texto claro */
  }

  /* Estado deshabilitado */
  .mroy-select:disabled,
  .mroy-input:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>


<script>
  // --- Debug helper
  const dbgModal = (msg, obj) => console.log(`🟣 MROY MODAL: ${msg}`, obj ?? "");

  // --- Normaliza códigos tipo "1" -> "01"
  const normalize2 = (val) => {
    const s = String(val ?? "").trim();
    if (!s) return "";
    if (/^\d$/.test(s)) return `0${s}`;
    return s;
  };

  // --- Set seguro de un select, probando varias variantes
  const setSelectValueSafe = (selectId, value) => {
    const el = document.getElementById(selectId);
    if (!el) {
      console.warn(`⚠️ ${selectId}: no existe en DOM`);
      return false;
    }

    let raw = String(value ?? "").trim();
    // si viene "1.0" o 1.0 desde backend/serialización, normalizamos
    raw = raw.replace(/\.0$/, "");

    if (!raw) {
      dbgModal(`${selectId}: value vacío`, { value });
      return false;
    }

    const v1 = raw;
    const v2 = normalize2(raw);
    const v3 = raw.replace(/^0/, "");
    const options = Array.from(el.options).map(o => String(o.value).trim());
    const candidates = [v1, v2, v3].filter(Boolean);

    dbgModal(`${selectId}: intento set`, { raw, candidates });

    for (const v of candidates) {
      if (options.includes(v)) {
        el.value = v;
        dbgModal(`✅ ${selectId} seteado`, { selected: el.value });
        return true;
      }
    }

    console.warn(`⚠️ ${selectId}: no existe en options`, { raw, candidates, options });
    return false;
  };

  // --- Preview del código MROY
  function updateMroyCodePreview() {
    const ids = [
      "code_01", "code_02", "code_03", "code_04", "code_05", "code_06", "code_07", "code_08", "code_09",
      "code_10", "code_11", "code_12", "code_13", "code_14", "code_15", "code_16", "code_17", "code_18"
    ];
    const values = {};
    ids.forEach(id => values[id] = document.getElementById(id)?.value || "");

    let fullCode = "MRA1-";
    const core = (values.code_01 || values.code_02 || values.code_03)
      ? `${values.code_01}${values.code_02}${values.code_03}`
      : "";
    fullCode += core;

    const extras = [
      values.code_04, values.code_05, values.code_06, values.code_07, values.code_08, values.code_09,
      values.code_10, values.code_11, values.code_12, values.code_13, values.code_14, values.code_15,
      values.code_16, values.code_17, values.code_18
    ].filter(Boolean).join("");

    if (extras) fullCode += "-" + extras;

    const previewSpan = document.getElementById("mroy_full_code_preview");
    if (previewSpan) previewSpan.textContent = fullCode;

    const hiddenFull = document.getElementById("mroy_full_code");
    if (hiddenFull) hiddenFull.value = fullCode;
  }

  // --- Función global (para onclick)
  window.openMroySelector = function (pumpIdStr, tagStr = "") {

    // 1) Reset 01–03 a vacío (placeholder)
    ["code_01", "code_02", "code_03"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = "";
    });

    // 2) Reset 04–18 al primer item
    [
      "code_04", "code_05", "code_06", "code_07", "code_08", "code_09",
      "code_10", "code_11", "code_12", "code_13", "code_14", "code_15", "code_16", "code_17", "code_18"
    ].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.selectedIndex = 0;
    });

    // 3) Reset preview/hidden
    const hiddenFull = document.getElementById("mroy_full_code");
    if (hiddenFull) hiddenFull.value = "MRA1-";
    const previewSpan = document.getElementById("mroy_full_code_preview");
    if (previewSpan) previewSpan.textContent = "MRA1-";

    // 4) Buscar bomba en payload
    const pumpId = parseInt(pumpIdStr, 10);
    const pump = (window.pumpsData?.db || []).find(p => p.id === pumpId);
    if (!pump) {
      console.warn("No se encontró bomba en BD para pumpId", pumpId);
      return;
    }

    const hasMroySelection = !!pump.mroy_full_code;

    // 7A) Si YA hay selección guardada → cargar 01–18 desde BD (pump.mroy_codes)
    if (hasMroySelection && pump.mroy_codes) {
      dbgModal("LOAD existing selection from DB", pump.mroy_codes);

      // Cargar 01–03
      setSelectValueSafe("code_01", pump.mroy_codes["01"]);
      setSelectValueSafe("code_02", pump.mroy_codes["02"]);
      setSelectValueSafe("code_03", pump.mroy_codes["03"]);

      // Cargar 04–18
      for (let i = 4; i <= 18; i++) {
        const k = String(i).padStart(2, "0");
        setSelectValueSafe(`code_${k}`, pump.mroy_codes[k]);
      }
    }


    // 5) UI básica (safe)
    const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val ?? ""; };

    const tag = (tagStr && String(tagStr).trim())
      ? tagStr
      : (pump.tag || `Bomba #${pump.id}`);

    setText("mroy_proc_tag", tag);
    setText("mroy-modal-tag", tag);
    setText("mroy_header_tag", tag);


    const pumpIdEl = document.getElementById("mroy_pump_id");
    if (pumpIdEl) pumpIdEl.value = pump.id;

    // 6) Action del form
    const form = document.getElementById("mroy-selection-form");
    if (form) {
      if (!window.currentCaseId) {
        console.warn("⚠️ currentCaseId no existe o está vacío. No puedo armar el form.action");
      } else {
        form.action = `/quote/${window.currentCaseId}/detected-pump/${pump.id}/save-mroy-selection`;
        form.method = "post";
      }
    }

    // 7) Autoselección 01–03 si NO hay selección previa
    if (!hasMroySelection && window.autoMroyData) {
      const suggestion = window.autoMroyData[pumpId] || window.autoMroyData[String(pumpId)] || null;
      dbgModal("SUGGESTION lookup", { pumpId, suggestion });

      if (suggestion) {
        setSelectValueSafe("code_01", suggestion.code_01);
        setSelectValueSafe("code_02", suggestion.code_02);
        setSelectValueSafe("code_03", suggestion.code_03);
      } else {
        console.warn("⚠️ No hubo suggestion para pumpId", pumpId);
      }
    }

    // 8) Preview + abrir modal
    updateMroyCodePreview();

    if (typeof window.openModal !== "undefined") window.openModal("modal-mroy-selector");
    else document.getElementById("modal-mroy-selector")?.classList.remove("hidden");
  };

  // --- Listeners (una vez)
  (function bindMroyListenersOnce() {
    if (window.__mroyListenersBound) return;
    window.__mroyListenersBound = true;

    [
      "code_01", "code_02", "code_03", "code_04", "code_05", "code_06", "code_07", "code_08",
      "code_09", "code_10", "code_11", "code_12", "code_13", "code_14", "code_15", "code_16", "code_17", "code_18"
    ].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("change", updateMroyCodePreview);
    });
  })();
</script>
