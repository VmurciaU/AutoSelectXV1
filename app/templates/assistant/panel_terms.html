<!-- Términos -->
<details class="bg-gray-900 rounded-lg border border-gray-700">
  <summary class="cursor-pointer px-3 py-2 flex items-center justify-between text-xs font-semibold bg-gray-800 text-gray-200">
    <span>Términos comerciales y Notas</span>
    <span class="text-gray-400 text-[11px]">
      {% if selected_terms %}
        {{ selected_terms.nombre }}
      {% else %}
        estándar
      {% endif %}
    </span>
  </summary>

  <div class="px-3 py-2 border-t border-gray-700 space-y-2 text-xs text-gray-200">

    {% if selected_terms %}
      <p class="text-[11px] text-gray-300 whitespace-pre-line">
        {{ selected_terms.texto }}
      </p>
    {% else %}
      <p class="text-[11px] text-gray-400">
        Se usarán términos estándar hasta seleccionar una plantilla.
      </p>
    {% endif %}

    <button type="button"
            class="w-full px-3 py-1.5 rounded-md text-[11px] font-semibold bg-gray-800 hover:bg-gray-700 border border-gray-600">
      Seleccionar / editar términos
    </button>

  </div>
</details>
